[package]
name = "deltaflens"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[dependencies]
color-eyre = "0.6"
deltaflens-core = { path = "crates/deltaflens-core" }
eyre = "0.6"
gpui = { git = "https://github.com/zed-industries/zed", rev = "544780422affd11699fb531c49af5cc6e82a3fd7" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "544780422affd11699fb531c49af5cc6e82a3fd7", features = ["font-kit", "wayland", "x11"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
