[package]
name = "deltaflens"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
deltaflens-core = { path = "crates/deltaflens-core" }
eyre = "0.6"
gpui = { git = "https://github.com/zed-industries/zed", rev = "544780422affd11699fb531c49af5cc6e82a3fd7" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "544780422affd11699fb531c49af5cc6e82a3fd7", features = ["font-kit", "wayland", "x11"] }
# Only for wrapping decoded pixels in the buffer type gpui expects.
image = { version = "0.25", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Opens AVIF images with dav1d, which must be installed where it is built.
avif = ["deltaflens-core/avif"]

# For `mallopt`, which glibc offers but the standard library does not.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[lints]
workspace = true

# Image decoding in debug builds is several to tens of times slower than in
# release builds, so optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

# The resizing of fast_image_resize is generic and compiled in deltaflens-core,
# where it was about 70 times slower than in release builds.
[profile.dev.package.deltaflens-core]
opt-level = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
