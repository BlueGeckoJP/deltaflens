name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # System libraries needed to build gpui (see script/linux in the Zed repository).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            pkg-config

      # rustup reads rust-toolchain.toml and installs the pinned toolchain and components.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The `avif` feature needs dav1d, which the default build does not.
      - name: Install dav1d
        run: sudo apt-get install -y libdav1d-dev

      - name: Clippy with AVIF
        run: cargo clippy --workspace --all-targets --features avif -- -D warnings

      - name: Test with AVIF
        run: cargo test --workspace --features avif
