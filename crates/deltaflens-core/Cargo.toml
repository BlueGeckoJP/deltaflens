[package]
name = "deltaflens-core"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6"
# The same major version and formats as gpui. The default "avif" feature is
# left out: it only adds an encoder, yet makes `ImageFormat::Avif` report
# reading as enabled.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
# Lanczos3 resizing with SIMD, several times faster than `image::imageops`.
fast_image_resize = { version = "6", features = ["only_u8x4"] }
jxl-oxide = "0.12"
# The same version as jxl-oxide uses. For reading the samples of a rendered
# frame directly, which is much faster than the stream of jxl-oxide.
jxl-render = "0.12"
# Converts images with ICC profiles to sRGB. Written in Rust, without system
# libraries. The same version as image uses.
moxcms = "0.8"
# For the file names of the freedesktop thumbnail cache.
md-5 = "0.10"
natord = "1.0"
# The same version as image uses. Reads and writes the text chunks that the
# freedesktop thumbnail cache keeps in its PNG files.
png = "0.18"
tracing = "0.1"

[lints]
workspace = true
